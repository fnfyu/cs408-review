[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# JSON 数据可能随构建更新，每次都重新校验
[[headers]]
  for = "/public/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 原页 webp / 插图 / PDF：路径稳定，按静态资源长期缓存
[[headers]]
  for = "/public/slides/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/figures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/sources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 壳子文件：短缓存，方便发版后尽快更新
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
